name = "signalbase-mcp"
main = "src/entry.py"
compatibility_date = "2024-12-18"
compatibility_flags = ["python_workers"]

[observability]
enabled = true

# Uncomment and edit to use a custom domain:
# [[routes]]
# pattern = "mcp.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Local end-to-end testing against a local checkout of the app:
#   npx wrangler dev --env local --port 8787
# (the app must be running on http://localhost:3000)
[env.local]
vars = { API_BASE = "http://localhost:3000/api/v2" }
